_format_version: "3.0"
_info:
  select_tags:
    - platform-team

plugins:
  - name: rate-limiting-advanced
    service: shared-service
    config:
      limit:
        - 500
      window_size:
        - 3600
      window_type: sliding
      disable_penalty: false
      namespace: platform-team
      strategy: local
    tags: # _infoに書いてあるため省略可能
      - platform-team