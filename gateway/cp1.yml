_format_version: "3.0"
_info:
  select_tags:
    - platform-team

services:
  - name: test-service1
    url: https://backend.internal-1
    tags:
      - platform-team
    routes:
      - name: test-route1
        paths:
          - /route1
        tags:
          - platform-team

plugins:
  - name: rate-limiting-advanced
    service: test-service1
    config:
      limit:
        - 500
      window_size:
        - 3600
      window_type: sliding
      disable_penalty: false
      namespace: platform-team
      strategy: local
    tags:
      - platform-team