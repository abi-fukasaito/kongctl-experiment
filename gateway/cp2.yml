_format_version: "3.0"
_info:
  select_tags:
    - platform-team

services:
  - name: test-service2
    url: https://backend.internal-2
    tags:
      - platform-team
    routes:
      - name: test-route2
        paths:
          - /route2
        tags:
          - platform-team
  
  - name: test-service3
    url: https://backend.internal-3
    tags:
      - platform-team
    routes:
      - name: test-route3
        paths:
          - /route3
        tags:
          - platform-team

plugins:
  - name: service-protection
    service: test-service2
    config:
      window_size:
        - 60
      limit:
        - 10
      namespace: platform-team
    tags: 
      - platform-team